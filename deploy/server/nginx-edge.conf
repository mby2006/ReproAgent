# 公网侧唯一允许打进 Supabase 的路径白名单。
#
# 存在的原因：前端只用 supabase-js 做 GoTrue 登录，浏览器从来不需要 /rest/v1 和
# /storage/v1 —— 而这两个前缀恰好是 RLS 之外的一切：/rest/v1 能直接读表，
# /storage/v1 能拿签名 URL，/auth/v1/admin 能用 service_role 枚举用户。
# 只要把它们留在公网上，任何一个会用 curl 的人都能绕开我们自己的鉴权。
#
# 因此 Kong 继续保留官方那份完整的 kong.yml（内网里 api/worker 要用 /rest、/storage），
# 公网入口则单独过这一层：不在白名单里的路径一律 404，连「存在但禁止」都不告诉对方。
# 白名单只有 auth/v1 下的四个精确路径 —— 用 = 而不是前缀匹配，
# 免得 /auth/v1/token/anything 这种以后被 GoTrue 加出来的子路由顺道漏出去。
#
# 注意：CORS 头由 Kong 的 cors 插件负责（它对 OPTIONS 预检直接回 204，先于 key-auth），
# 这里刻意不再补加，否则 Access-Control-Allow-Origin 会出现两个值而被浏览器拒绝。

server {
    listen 80;
    server_name _;

    # 必须用变量 + Docker 内嵌 DNS，不能在 proxy_pass 里写死 kong:8000：
    # nginx 只在启动时解析一次 upstream 主机名，而每次重建 supabase（换域名、换密钥）
    # Kong 都会拿到新的容器 IP，写死的话 edge 会对着一台已经不存在的地址 502。
    # 2026-11-23 换域名时就撞上过一次。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kong_backend http://kong:8000;

    # 容器之间没有 NAT，取真实来源只为了 Kong 的日志和限流判断。
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    # GoTrue 用这两个头决定签发后的跳转地址；cloudflared 已经是 https，
    # 不写 proto 的话邮件里的链接会退成 http（当前没开 SMTP，属于兜底）。
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

    # 登录 / 刷新令牌：POST /auth/v1/token?grant_type=password|refresh_token
    location = /auth/v1/token   { proxy_pass $kong_backend; }
    location = /auth/v1/logout  { proxy_pass $kong_backend; }
    location = /auth/v1/user    { proxy_pass $kong_backend; }
    # supabase-js 初始化时探测服务是否可达，只回 {"status":"ok"}。
    location = /auth/v1/health  { proxy_pass $kong_backend; }

    location / {
        return 404;
    }
}
