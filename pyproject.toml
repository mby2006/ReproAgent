[project]
name = "reproagent-workspace"
version = "0.1.0"
description = "ReproAgent monorepo - uv workspace root"
requires-python = ">=3.12"
dependencies = [
    "reproagent-schemas",
    "reproagent-paperparse",
    "reproagent-api",
    "reproagent-agent",
    "reproagent-runner",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["apps/api", "apps/agent", "apps/runner", "packages/schemas", "packages/paperparse"]

[tool.uv.sources]
reproagent-schemas = { workspace = true }
reproagent-paperparse = { workspace = true }
reproagent-api = { workspace = true }
reproagent-agent = { workspace = true }
reproagent-runner = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = [
    "packages/schemas/tests",
    "packages/paperparse/tests",
    "apps/api/tests",
    "apps/agent/tests",
    "apps/runner/tests",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q --import-mode=importlib"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".runner-work*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]