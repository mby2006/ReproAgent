[project]
name = "reproagent-runner"
version = "0.1.0"
description = "ReproAgent isolated Python execution worker. No LLM key, no Supabase key."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "docker>=7.1",
    "reproagent-schemas",
]

[project.optional-dependencies]
# Installed in the Docker image (CPU wheels); skipped in local phase-1 dev.
ml = ["torch>=2.4", "torchvision>=0.19"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproagent_runner"]

[tool.uv.sources]
reproagent-schemas = { workspace = true }
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true