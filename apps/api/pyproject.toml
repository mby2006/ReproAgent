[project]
name = "reproagent-api"
version = "0.1.0"
description = "ReproAgent public API: auth, ownership, business data, job orchestration"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "supabase>=2.7",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "langgraph>=0.2",
    "langgraph-checkpoint-postgres>=2.0",
    "psycopg[binary,pool]>=3.1",
    "reproagent-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproagent_api"]

[tool.uv.sources]
reproagent-schemas = { workspace = true }