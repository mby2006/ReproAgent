[project]
name = "reproagent-schemas"
version = "0.1.0"
description = "Shared Pydantic schemas: the contract between ReproAgent web/api/agent/runner"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reproagent_schemas"]